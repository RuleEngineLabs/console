name: Feature — Validate & Open PR

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.mjs

  validate:
    name: Angular validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint
        continue-on-error: true

      - name: Build
        run: npx ng build --configuration production

      - name: Test + coverage
        run: npx ng test --no-watch --code-coverage --browsers=ChromeHeadless

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/

  open-pr:
    name: Open PR → develop (se não existe)
    needs: [commitlint, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create PR to develop (idempotente)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          EXISTING=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING já existe — push atualizou o diff, CI vai disparar no synchronize."
          else
            TITLE="feat: ${BRANCH#feature/}"
            BODY=$(printf "## Automated PR\n\nBranch: \`%s\`\n\n**CI passed:** commitlint ✅ | lint ✅ | build ✅ | tests ✅ | coverage ✅" "$BRANCH")
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
          fi
